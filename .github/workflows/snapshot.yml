name: Snapshot Taurus rates

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC daily = 07:00 SAST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and rank
        env:
          TAURUS_TOKEN_URL: ${{ vars.TAURUS_ENV == 'production' && secrets.TAURUS_TOKEN_URL_PROD || secrets.TAURUS_TOKEN_URL_STAGING }}
          TAURUS_API_URL: ${{ vars.TAURUS_ENV == 'production' && secrets.TAURUS_API_URL_PROD || secrets.TAURUS_API_URL_STAGING }}
          TAURUS_CLIENT_ID: ${{ secrets.TAURUS_CLIENT_ID }}
          TAURUS_CLIENT_SECRET: ${{ vars.TAURUS_ENV == 'production' && secrets.TAURUS_CLIENT_SECRET_PROD || secrets.TAURUS_CLIENT_SECRET_STAGING }}
          TAURUS_SCOPE: ${{ secrets.TAURUS_SCOPE }}
        run: python3 scripts/fetch_and_rank.py

      - name: Commit snapshot
        run: |
          git config user.name "aggregator-rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/snapshot.json docs/history.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
